[project]
name = "{{cookiecutter.project_slug}}"
version = "0.1.0"
description = "{{cookiecutter.project_description}}"
authors = [
    {name = "{{cookiecutter.author_name}}", email = "{{cookiecutter.author_email}}"},
]
readme = "README.md"
requires-python = ">={{cookiecutter.python_version}}"
dependencies = [
    "google-adk>=1.0.0",
    "google-cloud-aiplatform[agent_engines]>=1.90.0",
    "litellm>=1.50.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
    "commitizen>=3.0.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
target-version = "py{{cookiecutter.python_version | replace('.', '')}}"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N"]
# UP046/UP047 want PEP 695 generics (`def instrument[F](func: F) -> F`), which are 3.12+
# syntax. This project's sources come from a cookiecutter template that must also render
# and parse under Python 3.11, so they stay suppressed even when target-version is py312 —
# without this, generating with python_version=3.12 produces a project that fails its own
# `ruff check` on the first CI run. Safe to drop if you never intend to support 3.11.
ignore = ["E501", "UP046", "UP047"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "{{cookiecutter.python_version}}"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Covers deployment/ as well as agent/. deploy.py ships the pickled agent to production and
# is the highest-blast-radius code here, so it belongs under the gate rather than outside it.
addopts = "--cov=agent --cov=deployment --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.report]
exclude_also = [
    # argparse entry points in deploy.py / health_check.py. No import-based test can reach
    # these, so counting them only depresses the number without saying anything useful.
    "if __name__ == .__main__.:",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_scheme = "semver"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
version_files = ["pyproject.toml:^version"]
