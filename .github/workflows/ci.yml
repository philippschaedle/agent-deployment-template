name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-template:
    name: Lint template repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          ignore-nothing-to-cache: true

      - run: uv sync

      - name: Lint hooks/
        run: uv run ruff check hooks/

      - name: Format check hooks/
        run: uv run ruff format --check hooks/

      - name: Type check hooks/
        run: uv run pyright hooks/

      - name: Validate cookiecutter.json
        run: python3 -c "import json; json.load(open('cookiecutter.json')); print('cookiecutter.json is valid JSON')"

      # Run the pinned pre-commit hook rather than markdownlint-cli2-action, so CI and
      # `make pre-commit` cannot disagree. They did: the action at @v16 bundles
      # markdownlint-cli2 v0.13.0 while .pre-commit-config.yaml pins v0.22.1, and v0.13.0
      # could not resolve `"extends": "markdownlint/style/relaxed"` in the generated
      # project's own .markdownlint.json — it failed with ENOENT on a path built from the
      # literal {{cookiecutter.project_slug}} directory name. One pinned version, one
      # source of truth. This also drops the old !.venv/** glob workaround: pre-commit only
      # ever looks at git-tracked files, so third-party markdown under .venv is excluded by
      # construction rather than by an exclusion someone has to remember to maintain.
      - name: Lint markdown
        run: uv run pre-commit run markdownlint-cli2 --all-files --show-diff-on-failure
