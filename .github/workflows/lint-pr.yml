name: Lint PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventional-commit:
    name: Check PR title format
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commit format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Exactly the set commitizen's cz_conventional_commits accepts, matching the
          # commit-msg hook configured in pyproject.toml. A narrower list here would reject
          # a PR title that the hook had already accepted as a commit message — a confusing
          # place for the two to disagree. Kept in step with the same list in
          # {{cookiecutter.project_slug}}/.github/workflows/lint-pr.yml.
          types: |
            build
            bump
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          requireScope: false
